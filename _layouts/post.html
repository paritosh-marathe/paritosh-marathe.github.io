---
layout: default
body_class: page-post
---
<article class="post" data-reveal>
  <header class="post__header">
    <p class="post__date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    <h1 class="post__title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="post__dek">{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="post__body prose">
    {{ content }}
  </div>
  <footer class="post__footer">
    <a class="text-link" href="{{ '/blog/' | relative_url }}">← All notes</a>
  </footer>
</article>
