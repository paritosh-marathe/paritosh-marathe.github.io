<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}?v=connect1">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v=connect1" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}?v=connect1">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}?v=connect1">
  <link rel="icon" type="image/svg+xml" sizes="any" href="{{ '/favicon.svg' | relative_url }}?v=connect1">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}?v=connect1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    document.documentElement.classList.add("js");
    try {
      if (localStorage.getItem("pm-theme") === "light") document.documentElement.dataset.theme = "light";
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
  {% seo %}
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    {% include nav.html %}
    <main id="main" class="site-main">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="{{ '/js/site.js' | relative_url }}" defer></script>
</body>
</html>
