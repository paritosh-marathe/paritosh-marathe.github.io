<header class="site-header" data-header>
  <a class="site-logo" href="{{ '/' | relative_url }}"><img class="logo-mark" src="{{ '/images/brand/pm-connect.svg' | relative_url }}" alt="" width="52" height="52"><span>Paritosh Marathe</span></a>
  <nav id="site-nav" class="site-nav" data-nav>
    <ul>
      {% if page.layout == 'home' or page.url == '/' %}
      <li><a href="#skills">Skills</a></li>
      <li><a href="#work">Work</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="{{ '/blog/' | relative_url }}">Notes</a></li>
      <li><a href="#contact">Contact</a></li>
      {% else %}
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/#skills' | relative_url }}">Skills</a></li>
      <li><a href="{{ '/#work' | relative_url }}">Work</a></li>
      <li><a href="{{ '/blog/' | relative_url }}">Notes</a></li>
      <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
      {% endif %}
    </ul>
  </nav>
  <div class="header-actions">
    <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false" data-theme-toggle hidden>
      <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
    </button>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
    <span class="nav-toggle__label">Menu</span>
    <span class="nav-toggle__bars" aria-hidden="true"></span>
  </button>
  </div>
</header>
