<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="title desc"><title id="title">TURN allocation and encrypted media relay</title><desc id="desc">A viewer obtains a relay allocation, authorizes the peer, and exchanges DTLS-SRTP traffic with the media server through TURN. This is one possible one-sided relay topology.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#eabe7c" stroke-width="1.5"/></marker></defs><rect width="760" height="435" fill="#111113"/><text x="30" y="35" text-anchor="start" fill="#eabe7c" font-family="Arial,sans-serif" font-size="12">TURN / RELAYED MEDIA</text><rect x="25" y="60" width="190" height="60" rx="3" fill="#19191c" stroke="#6b5940"/><text x="120.0" y="88" text-anchor="middle" fill="#f4f2ec" font-family="Arial,sans-serif" font-size="17">Viewer</text><text x="120.0" y="109" text-anchor="middle" fill="#aaa9ae" font-family="Arial,sans-serif" font-size="12">TURN client in this example</text><rect x="285" y="60" width="190" height="60" rx="3" fill="#19191c" stroke="#6b5940"/><text x="380.0" y="88" text-anchor="middle" fill="#f4f2ec" font-family="Arial,sans-serif" font-size="17">TURN server</text><text x="380.0" y="109" text-anchor="middle" fill="#aaa9ae" font-family="Arial,sans-serif" font-size="12">Allocation + peer permissions</text><rect x="545" y="60" width="190" height="60" rx="3" fill="#19191c" stroke="#6b5940"/><text x="640.0" y="88" text-anchor="middle" fill="#f4f2ec" font-family="Arial,sans-serif" font-size="17">Media server</text><text x="640.0" y="109" text-anchor="middle" fill="#aaa9ae" font-family="Arial,sans-serif" font-size="12">WebRTC peer</text><path d="M120 125 V350" stroke="#35353b" stroke-dasharray="4 5"/><path d="M380 125 V350" stroke="#35353b" stroke-dasharray="4 5"/><path d="M640 125 V350" stroke="#35353b" stroke-dasharray="4 5"/><path d="M120 160 L380 160" fill="none" stroke="#aaa9ae" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="250.0" y="150.0" text-anchor="middle" fill="#eabe7c" font-family="Arial,sans-serif" font-size="13">Allocate / authenticate</text><path d="M380 208 L120 208" fill="none" stroke="#aaa9ae" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="250.0" y="198.0" text-anchor="middle" fill="#eabe7c" font-family="Arial,sans-serif" font-size="13">Relayed address:port</text><path d="M120 256 L380 256" fill="none" stroke="#aaa9ae" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="250.0" y="246.0" text-anchor="middle" fill="#eabe7c" font-family="Arial,sans-serif" font-size="13">Permit the peer</text><path d="M120 310 L380 310" fill="none" stroke="#eabe7c" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 310 L640 310" fill="none" stroke="#eabe7c" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 342 L380 342" fill="none" stroke="#eabe7c" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 342 L120 342" fill="none" stroke="#eabe7c" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="382" text-anchor="middle" fill="#f4f2ec" font-family="Arial,sans-serif" font-size="15">DTLS-SRTP traffic follows the relay path in this example.</text><text x="380" y="408" text-anchor="middle" fill="#aaa9ae" font-family="Arial,sans-serif" font-size="13">Dashed: setup. Solid: relayed WebRTC traffic.</text></svg>