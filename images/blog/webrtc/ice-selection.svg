<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">ICE checks candidate pairs and selects a media route</title><desc id="desc">Host, STUN-discovered and TURN-relayed candidates are paired and checked. ICE selects a working pair rather than following a fixed STUN-then-TURN sequence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#eabe7c" stroke-width="1.5"/></marker></defs><rect width="760" height="400" fill="#111113"/><text x="30" y="35" text-anchor="start" fill="#eabe7c" font-family="Arial,sans-serif" font-size="12">ICE / CANDIDATE CHECKS</text><rect x="25" y="80" width="190" height="55" rx="3" fill="#19191c" stroke="#6b5940"/><text x="120.0" y="108" text-anchor="middle" fill="#f4f2ec" font-family="Arial,sans-serif" font-size="17">Host / local</text><rect x="25" y="175" width="190" height="55" rx="3" fill="#19191c" stroke="#6b5940"/><text x="120.0" y="203" text-anchor="middle" fill="#f4f2ec" font-family="Arial,sans-serif" font-size="17">STUN-discovered</text><rect x="25" y="270" width="190" height="55" rx="3" fill="#19191c" stroke="#6b5940"/><text x="120.0" y="298" text-anchor="middle" fill="#f4f2ec" font-family="Arial,sans-serif" font-size="17">TURN-relayed</text><rect x="290" y="160" width="190" height="80" rx="3" fill="#19191c" stroke="#6b5940"/><text x="385.0" y="188" text-anchor="middle" fill="#f4f2ec" font-family="Arial,sans-serif" font-size="17">Candidate pairs</text><text x="385.0" y="209" text-anchor="middle" fill="#aaa9ae" font-family="Arial,sans-serif" font-size="12">STUN connectivity checks</text><rect x="550" y="160" width="185" height="80" rx="3" fill="#19191c" stroke="#6b5940"/><text x="642.5" y="188" text-anchor="middle" fill="#f4f2ec" font-family="Arial,sans-serif" font-size="17">Selected pair</text><text x="642.5" y="209" text-anchor="middle" fill="#aaa9ae" font-family="Arial,sans-serif" font-size="12">Working media route</text><path d="M215 107 L290 180" fill="none" stroke="#eabe7c" stroke-width="2" marker-end="url(#arrow)"/><path d="M215 202 L290 202" fill="none" stroke="#eabe7c" stroke-width="2" marker-end="url(#arrow)"/><path d="M215 297 L290 225" fill="none" stroke="#eabe7c" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 202 L550 202" fill="none" stroke="#eabe7c" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="355" text-anchor="middle" fill="#aaa9ae" font-family="Arial,sans-serif" font-size="14">Candidates are exchanged through signaling, such as WHEP.</text><text x="380" y="380" text-anchor="middle" fill="#aaa9ae" font-family="Arial,sans-serif" font-size="13">This is not a mandatory “try STUN, then TURN” ladder.</text></svg>