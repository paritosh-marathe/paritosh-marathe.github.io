<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">STUN address discovery</title><desc id="desc">A viewer sends a Binding request through NAT to a STUN server. The response reports the observed external address and port; it does not carry video.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#855316" stroke-width="1.5"/></marker></defs><rect width="760" height="400" fill="#f2ece1"/><text x="30" y="35" text-anchor="start" fill="#855316" font-family="Arial,sans-serif" font-size="12">STUN / ADDRESS DISCOVERY</text><rect x="25" y="65" width="190" height="65" rx="3" fill="#fffcf7" stroke="#92744d"/><text x="120.0" y="93" text-anchor="middle" fill="#24221e" font-family="Arial,sans-serif" font-size="17">Viewer</text><text x="120.0" y="114" text-anchor="middle" fill="#62605a" font-family="Arial,sans-serif" font-size="12">Local socket</text><rect x="285" y="65" width="190" height="65" rx="3" fill="#fffcf7" stroke="#92744d"/><text x="380.0" y="93" text-anchor="middle" fill="#24221e" font-family="Arial,sans-serif" font-size="17">NAT / router</text><text x="380.0" y="114" text-anchor="middle" fill="#62605a" font-family="Arial,sans-serif" font-size="12">Creates an external mapping</text><rect x="545" y="65" width="190" height="65" rx="3" fill="#fffcf7" stroke="#92744d"/><text x="640.0" y="93" text-anchor="middle" fill="#24221e" font-family="Arial,sans-serif" font-size="17">STUN server</text><text x="640.0" y="114" text-anchor="middle" fill="#62605a" font-family="Arial,sans-serif" font-size="12">Observes the source endpoint</text><path d="M120 140 V320" stroke="#c8bcab" stroke-dasharray="4 5"/><path d="M380 140 V320" stroke="#c8bcab" stroke-dasharray="4 5"/><path d="M640 140 V320" stroke="#c8bcab" stroke-dasharray="4 5"/><path d="M120 180 L380 180" fill="none" stroke="#62605a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="250.0" y="170.0" text-anchor="middle" fill="#855316" font-family="Arial,sans-serif" font-size="13">Binding request</text><path d="M380 180 L640 180" fill="none" stroke="#62605a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="510.0" y="170.0" text-anchor="middle" fill="#855316" font-family="Arial,sans-serif" font-size="13">Mapped source</text><path d="M640 260 L380 260" fill="none" stroke="#62605a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="510.0" y="250.0" text-anchor="middle" fill="#855316" font-family="Arial,sans-serif" font-size="13">Observed address:port</text><path d="M380 260 L120 260" fill="none" stroke="#62605a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="250.0" y="250.0" text-anchor="middle" fill="#855316" font-family="Arial,sans-serif" font-size="13">Binding response</text><text x="380" y="350" text-anchor="middle" fill="#24221e" font-family="Arial,sans-serif" font-size="16">Result: an address candidate to exchange and test.</text><text x="380" y="377" text-anchor="middle" fill="#62605a" font-family="Arial,sans-serif" font-size="13">The STUN server is not the video relay.</text></svg>