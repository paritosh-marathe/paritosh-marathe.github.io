title: Paritosh Marathe
description: AI systems engineer — edge vision, industrial telemetry, and software built for the field.
url: "https://paritosh-marathe.github.io"
baseurl: ""

author:
  name: Paritosh Marathe
  email: pmparitoshmarathe@gmail.com

markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - AGENTS.md
  - .playwright-mcp
  - CLAUDE.md
  - GEMINI.md
  - skills
  - plans
  - graphify-out
  - tmp
  - node_modules
  - playwright-report
  - test-results
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default
